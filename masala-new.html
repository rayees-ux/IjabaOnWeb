<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseUrl =
"https://bbriwfgbnnthvfwsehum.supabase.co/rest/v1/";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJicml3Zmdibm50aHZmd3NlaHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODA1NDgsImV4cCI6MjA5NDE1NjU0OH0.y5Z03Q38Xdcp2akStkd0rltEOnAOhGRoGGpTzl1RNBY";

const supabase =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

let allMasalas = [];

let currentSearchQuery = "";
let currentCategory = "all";

function categoryLabel(category){

    const labels = {
        prayer:"പ്രാർത്ഥന",
        fasting:"നോമ്പ്",
        zakath:"സകാത്ത്",
        hajj:"ഹജ്ജ്",
        marriage:"നിക്കാഹ്",
        ibadah:"ഇബാദത്ത്",
        family:"കുടുംബം",
        business:"വ്യാപാരം",
        modern:"ആധുനികം"
    };

    return labels[
        category?.toLowerCase()
    ] || category;

}

async function loadMasalas(){

    const { data, error } =
    await supabase
    .from("masalas")
    .select("*")
    .order("created_at",
    { ascending:false });

    console.log(data);
    console.log(error);

    if(error){

        document
        .getElementById(
            "masalaGrid"
        )
        .innerHTML =

        `<div class="error">
            Failed to load Mas'alas
        </div>`;

        return;
    }

    allMasalas = data;

    renderMasalas();

}

function renderMasalas(){

    const grid =
    document.getElementById(
        "masalaGrid"
    );

    let filtered =
    allMasalas.filter(item => {

        const matchesCategory =

        currentCategory === "all"

        ||

        item.category
        ?.toLowerCase()

        ===

        currentCategory;

        const matchesSearch =

        item.title
        ?.toLowerCase()
        .includes(
            currentSearchQuery
            .toLowerCase()
        )

        ||

        item.answer
        ?.toLowerCase()
        .includes(
            currentSearchQuery
            .toLowerCase()
        );

        return matchesCategory
        && matchesSearch;

    });

    if(!filtered.length){

        grid.innerHTML =

        `<div class="no-results">
            ഫലങ്ങളൊന്നും കണ്ടെത്താനായില്ല
        </div>`;

        return;

    }

    grid.innerHTML = filtered.map(item => `

        <article class="masala-card">

            <div class="masala-category">
                ${categoryLabel(item.category)}
            </div>

            <div class="masala-question">

                <div class="masala-question-main">

                    <span class="masala-label">
                        ചോദ്യം
                    </span>

                    <div class="masala-question-text">
                        ${item.title}
                    </div>

                </div>

                <span class="masala-toggle">
                    <i class="fas fa-chevron-down"></i>
                </span>

            </div>

            <div class="masala-answer-wrap">

                <div class="masala-answer">

                    <span class="masala-label">
                        ഉത്തരം
                    </span>

                    <div>
                        ${item.answer}
                    </div>

                </div>

            </div>

        </article>

    `).join("");

    enableToggle();

}

function enableToggle(){

    document
    .querySelectorAll(
        ".masala-question"
    )

    .forEach(question => {

        question.onclick = () => {

            const card =
            question.closest(
                ".masala-card"
            );

            const answer =
            card.querySelector(
                ".masala-answer-wrap"
            );

            card.classList.toggle(
                "expanded"
            );

            if(
                card.classList.contains(
                    "expanded"
                )
            ){

                answer.style.maxHeight =
                answer.scrollHeight
                + "px";

            } else {

                answer.style.maxHeight =
                null;

            }

        };

    });

}

document.addEventListener(
"DOMContentLoaded",
() => {

    document
    .getElementById(
        "masalaSearch"
    )

    .addEventListener(
        "input",
        e => {

            currentSearchQuery =
            e.target.value;

            renderMasalas();

        }
    );

    document
    .getElementById(
        "categoryFilter"
    )

    .addEventListener(
        "change",
        e => {

            currentCategory =
            e.target.value;

            renderMasalas();

        }
    );

    loadMasalas();

});

</script>
