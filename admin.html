<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IjabaOnWeb Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

:root{
  --green:#2e7d32;
  --green-dark:#1b5e20;
  --bg:#f4f8f4;
  --card:#ffffff;
  --border:#dfe8df;
  --text:#1f2937;
  --muted:#6b7280;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:
  radial-gradient(circle at top left,#dff1df,transparent 30%),
  var(--bg);

  min-height:100vh;
  padding:40px 20px;
}

.container{
  max-width:850px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:35px;
}

.logo{
  font-size:38px;
  font-weight:700;
  color:var(--green);
}

.sub{
  color:var(--muted);
  margin-top:10px;
}

.card{
  background:rgba(255,255,255,0.8);
  backdrop-filter:blur(14px);

  border:1px solid rgba(255,255,255,0.7);

  border-radius:28px;

  padding:35px;

  box-shadow:
  0 10px 40px rgba(0,0,0,0.06);
}

.tabs{
  display:flex;
  gap:14px;
  margin-bottom:28px;
}

.tab{
  flex:1;
  border:none;
  padding:16px;
  border-radius:16px;
  background:#edf5ed;
  color:var(--green);
  font-weight:700;
  cursor:pointer;
  transition:.3s;
  font-size:16px;
}

.tab.active{
  background:linear-gradient(
  135deg,
  var(--green),
  #43a047
  );

  color:white;
}

.form-section{
  display:none;
}

.form-section.active{
  display:block;
}

.form-group{
  margin-bottom:22px;
}

label{
  display:block;
  margin-bottom:10px;
  font-weight:600;
  color:var(--text);
}

input,
textarea,
select{
  width:100%;
  padding:16px;
  border-radius:18px;
  border:1px solid var(--border);
  background:white;
  outline:none;
  font-size:15px;
  transition:.3s;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--green);
  box-shadow:
  0 0 0 4px rgba(46,125,50,0.12);
}

textarea{
  min-height:180px;
  resize:vertical;
}

.btn{
  width:100%;
  border:none;
  padding:18px;
  border-radius:18px;

  background:linear-gradient(
  135deg,
  var(--green),
  var(--green-dark)
  );

  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;

  transition:.3s;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:
  0 10px 25px rgba(46,125,50,0.2);
}

.success{
  margin-top:18px;
  background:#e8f5e9;
  color:var(--green-dark);
  padding:16px;
  border-radius:14px;
  display:none;
  font-weight:600;
}

@media(max-width:700px){

  .tabs{
    flex-direction:column;
  }

  .card{
    padding:24px;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">
      IjabaOnWeb
    </div>

    <div class="sub">
      Admin Upload Panel
    </div>
  </div>

  <div class="card">

    <div class="tabs">

      <button class="tab active"
      onclick="showTab(event,'masala')">

      <i class="bi bi-question-circle"></i>
      Mas'ala

      </button>

      <button class="tab"
      onclick="showTab(event,'article')">

      <i class="bi bi-journal-text"></i>
      Article

      </button>

    </div>

    <!-- MASALA -->

    <div id="masala"
    class="form-section active">

      <div class="form-group">
        <label>Mas'ala Question</label>

        <textarea
        id="m_title"
        placeholder="Enter Mas'ala Question"></textarea>
      </div>

      <div class="form-group">
        <label>Category</label>

        <select id="m_category">

          <option>Prayer</option>
          <option>Fasting</option>
          <option>Zakath</option>
          <option>Hajj</option>
          <option>Marriage</option>
          <option>Ibadah</option>
          <option>Family</option>
          <option>Business</option>
          <option>Modern</option>

        </select>
      </div>

      <div class="form-group">
        <label>Answer</label>

        <textarea
        id="m_answer"
        placeholder="Enter Answer"></textarea>
      </div>

      <button class="btn"
      onclick="uploadMasala()">

      Upload Mas'ala

      </button>

      <div class="success"
      id="m_success">

      ✅ Mas'ala Uploaded Successfully

      </div>

    </div>

    <!-- ARTICLE -->

    <div id="article"
    class="form-section">

      <div class="form-group">
        <label>Article Title</label>

        <input
        id="a_title"
        placeholder="Enter Article Title">
      </div>

      <div class="form-group">
        <label>Category</label>

        <select id="a_category">

          <option>Prayer</option>
          <option>Fasting</option>
          <option>Zakath</option>
          <option>Hajj</option>
          <option>Marriage</option>
          <option>Ibadah</option>
          <option>Family</option>
          <option>Business</option>
          <option>Modern</option>

        </select>
      </div>

      <div class="form-group">
        <label>Preview Text</label>

        <textarea
        id="a_preview"
        placeholder="Small Preview"></textarea>
      </div>

      <div class="form-group">
        <label>Image URL</label>

        <input
        id="a_image"
        placeholder="Paste Image URL">
      </div>

      <div class="form-group">
        <label>Article Content</label>

        <textarea
        id="a_content"
        placeholder="Enter Full Article"></textarea>
      </div>

      <button class="btn"
      onclick="uploadArticle()">

      Upload Article

      </button>

      <div class="success"
      id="a_success">

      ✅ Article Uploaded Successfully

      </div>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://bbriwfgbnnthvfwsehum.supabase.co/rest/v1/";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJicml3Zmdibm50aHZmd3NlaHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODA1NDgsImV4cCI6MjA5NDE1NjU0OH0.y5Z03Q38Xdcp2akStkd0rltEOnAOhGRoGGpTzl1RNBY";

const supabase =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function uploadMasala() {

  const title =
  document.getElementById("m_title").value;

  const category =
  document.getElementById("m_category").value;

  const answer =
  document.getElementById("m_answer").value;

  const { error } =
  await supabase
  .from("masala")
  .insert([{

    title,
    category,
    answer

  }]);

  if(error){

    console.log(error);

    alert("❌ Upload Failed");

  }

  else{

    alert("✅ Uploaded Successfully");

  }

}

</script>
</body>
</html>
